<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LangGraph AI Assistant</title>
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-canvas: #F8FAFC;
            --surface-card: #FFFFFF;
            --purple-accent: #7C3AED;
            --purple-hover: #6D28D9;
            --purple-gradient: linear-gradient(135deg, #7C3AED 0%, #9333EA 50%, #C084FC 100%);
            --text-primary: #0F172A;
            --text-secondary: #64748B;
            --border: #EDE9FE;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: var(--bg-canvas);
            background: radial-gradient(circle at 80% 0%, rgba(192, 132, 252, 0.15) 0%, transparent 40%),
                        radial-gradient(circle at 20% 100%, rgba(124, 58, 237, 0.1) 0%, transparent 45%),
                        #F8FAFC;
            margin: 0;
            font-family: 'Outfit', sans-serif;
        }

        .auth-card {
            background-color: var(--surface-card);
            padding: 2.5rem;
            border-radius: 24px;
            border: 1px solid var(--border);
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 50px -10px rgba(124, 58, 237, 0.15);
            text-align: center;
        }

        .auth-header {
            margin-bottom: 2rem;
        }

        .auth-header i {
            width: 48px;
            height: 48px;
            color: var(--purple-accent);
            margin-bottom: 1rem;
        }

        .auth-header h1 {
            font-size: 1.8rem;
            color: var(--text-primary);
            margin: 0;
            font-weight: 800;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            padding: 0.8rem 1rem;
            background-color: #F8FAFC;
            border: 1px solid #E2E8F0;
            border-radius: 12px;
            color: var(--text-primary);
            font-family: inherit;
            box-sizing: border-box;
            transition: all 0.25s ease;
        }

        .form-control:focus {
            border-color: var(--purple-accent);
            background-color: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.12);
            outline: none;
        }

        .btn-auth {
            width: 100%;
            padding: 1rem;
            background: var(--purple-gradient);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            margin-top: 1rem;
            box-shadow: 0 8px 20px rgba(124, 58, 237, 0.25);
        }

        .btn-auth:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(124, 58, 237, 0.35);
        }

        .auth-footer {
            margin-top: 1.5rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .auth-footer a {
            color: var(--purple-accent);
            text-decoration: none;
            font-weight: 700;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .error-msg {
            color: #DC2626;
            background: #FEE2E2;
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            display: none;
            border: 1px solid #FCA5A5;
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="auth-header">
            <i data-lucide="bot"></i>
            <h1>Welcome Back</h1>
        </div>
        
        <div id="error-message" class="error-msg">Invalid credentials</div>

        <form id="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" class="form-control" placeholder="Enter username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn-auth">Sign In</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="/register">Register here</a>
        </div>
    </div>

    <script>
        lucide.createIcons();

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-message');

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('auth_token', data.access_token);
                    localStorage.setItem('username', data.username);
                    window.location.href = '/';
                } else {
                    errorMsg.textContent = data.detail || 'Login failed';
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.textContent = 'Network error. Please try again.';
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
